name: Build & Release

on:
  push:
    branches: [ Main-Branch ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          $dest = "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $dest
          Write-Host "Dalamud extracted to $dest"

      - name: Build
        run: dotnet build ICE/ICE.csproj --configuration Release

      - name: Locate package (latest.zip)
        id: pkg
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path ICE/bin -Recurse -Filter latest.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) { throw 'latest.zip not found under ICE/bin' }
          Write-Host "Found package: $($zip.FullName)"
          "path=$($zip.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $ver = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
          } else {
            [xml]$csproj = Get-Content ICE/ICE.csproj
            $ver = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          }
          Write-Host "Version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $exists = $false
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { $exists = $true }
          $global:LASTEXITCODE = 0
          if ($exists) {
            Write-Host "Release $tag already exists - skipping publish."
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
          }

      - name: Extract changelog from release merge
        if: steps.check.outputs.publish == 'true'
        id: changelog
        shell: pwsh
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # 本次 push 范围内、Main-Branch 主线上最新的合并提交
          $range = if ($env:BEFORE -and $env:BEFORE -notmatch '^0+$') { "$env:BEFORE..$env:AFTER" } else { $null }
          $merge = if ($range) {
            git log --first-parent --merges --format='%H' $range | Select-Object -First 1
          } else {
            $null
          }

          # tag 触发或首次 push：当前提交本身必须是合并提交
          if (-not $merge) {
            $parents = @(((git rev-list --parents -n 1 $env:AFTER) -join ' ').Trim() -split '\s+')
            if ($parents.Count -ge 3) { $merge = $env:AFTER }
          }
          if (-not $merge) {
            throw '未找到发布合并提交：请用 git merge --no-ff Develop 合并，并把中文 changelog 写在合并提交信息里'
          }

          # 取完整提交信息；若仍是 git 默认合并标题则只保留正文
          $text = ((git log -1 --pretty=%B $merge) -join "`n").Trim()
          if ($text -match '(?s)^Merge (branch|pull request)[^\r\n]*\r?\n\s*\r?\n(?<body>.+)$') {
            $text = $Matches['body'].Trim()
          }
          if ($text -match '^Merge (branch|pull request)') {
            throw "合并提交 $merge 仍是默认标题，请把中文 changelog 写入合并提交信息"
          }
          if (-not $text) { throw "合并提交 $merge 的提交信息为空" }

          # 首行是四段版本号时，校验与 ICE.csproj 一致
          $first = ($text -split "\r?\n")[0].Trim()
          if ($first -match '^\d+\.\d+\.\d+\.\d+$' -and $first -ne $env:VERSION) {
            throw "合并提交里的版本 $first 与 ICE.csproj 的版本 $env:VERSION 不一致"
          }

          "text<<CHANGELOG_EOF" >> $env:GITHUB_OUTPUT
          $text >> $env:GITHUB_OUTPUT
          "CHANGELOG_EOF" >> $env:GITHUB_OUTPUT

      - name: Update repo.json
        if: steps.check.outputs.publish == 'true'
        shell: pwsh
        env:
          CHANGELOG_TEXT: ${{ steps.changelog.outputs.text }}
        run: |
          $ver  = '${{ steps.ver.outputs.version }}'
          $url  = "https://github.com/${{ github.repository }}/releases/download/v$ver/latest.zip"
          $now  = [int][double]::Parse((Get-Date -UFormat %s))
          $path = 'repo.json'
          $t = Get-Content $path -Raw
          # 仅替换字段值，保留原文件格式/字段顺序
          $t = [regex]::Replace($t, '("AssemblyVersion"\s*:\s*)"[^"]*"',     ('${1}"' + $ver + '"'))
          $t = [regex]::Replace($t, '("DownloadLinkInstall"\s*:\s*)"[^"]*"', ('${1}"' + $url + '"'))
          $t = [regex]::Replace($t, '("DownloadLinkUpdate"\s*:\s*)"[^"]*"',  ('${1}"' + $url + '"'))
          $t = [regex]::Replace($t, '("LastUpdate"\s*:\s*)\d+',              ('${1}'   + $now))

          # 合并提交信息 -> JSON 字符串，定点写入 Changelog
          $cl = $env:CHANGELOG_TEXT.Trim()
          if (-not $cl) { throw 'changelog 为空，已中止发布' }
          $escaped = $cl.Replace('\', '\\').Replace('"', '\"').Replace("`r`n", '\n').Replace("`n", '\n').Replace("`r", '\n')
          if ($t -notmatch '"Changelog"\s*:') { throw 'repo.json 缺少 Changelog 字段' }
          $replacement = '${1}"' + $escaped.Replace('$', '$$') + '"'
          $t = [regex]::Replace($t, '("Changelog"\s*:\s*)"(?:[^"\\]|\\.)*"', $replacement)

          # 写回前校验 JSON 仍然合法
          $null = $t | ConvertFrom-Json

          Set-Content -Path $path -Value $t -NoNewline -Encoding utf8
          Get-Content $path

      - name: Create Release
        if: steps.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body: ${{ steps.changelog.outputs.text }}
          files: ${{ steps.pkg.outputs.path }}
          fail_on_unmatched_files: true

      - name: Commit repo.json to Main-Branch
        if: steps.check.outputs.publish == 'true'
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin Main-Branch
          git checkout -B Main-Branch origin/Main-Branch
          git add repo.json
          git commit -m "ci: repo.json -> v${{ steps.ver.outputs.version }}" 
          git push origin Main-Branch
